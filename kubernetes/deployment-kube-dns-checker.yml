apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-dns-checker
  labels:
    app: kube-dns-checker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-dns-checker
  template:
    metadata:
      labels:
        app: kube-dns-checker
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: '/metrics'
        prometheus.io/scheme: 'http'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: kube-dns-checker
      containers:
        - name: kube-dns-checker
          image: radut/kube-dns-checker
          imagePullPolicy: Always
          env:
            - name: DOMAINS
              value: "kubernetes.default.svc.cluster.local.,www.google.com."
            - name: NAMESERVERS
              value: "DEFAULT"
            - name: PROTOCOLS
              value: "udp,tcp"
            - name: TIMEOUT
              value: "2s"
            - name: INTERVAL
              value: "5s"
            - name: LOG_FORMAT
              value: "json"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
      tolerations:
        - operator: Exists
