variables:
  DOCKER_DRIVER: overlay2
  GOPATH: $CI_PROJECT_DIR/.go
  # GIT_SSL_NO_VERIFY is deliberately not set: it existed for the retired self-hosted GitLab's
  # self-signed certificate and on gitlab.com only disabled verification of the runner's own clone.
  #
  # Only what the in-cluster BuildKit can actually produce. The list used to name all eight platforms
  # alpine:3.21 is published for, on the reasoning that the Go stage cross-compiles - true, but the FINAL
  # stage runs `apk --no-cache add ca-certificates bind-tools` plus adduser/addgroup, and THAT executes on
  # the target platform. So every arch beyond the builder's QEMU handler (arm64) needs emulation it does
  # not have. Adding arm/v7 and the rest back means registering those handlers in the builder's
  # initContainer first (devops/argocd radut/platform/buildkit).
  BUILD_PLATFORMS: linux/amd64,linux/arm64

stages:
  - test
  - image

before_script:
  - set -e

test:
  image: golang:1.25
  stage: test
  cache:
    key: "$CI_PROJECT_NAME"
    paths:
      - .go/pkg/mod/
  script:
    - test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }
    - go vet ./...
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

# Image tags pushed to every registry:
#   main             -> latest, v<VERSION>, <short sha>
#   git tag vX.Y.Z   -> vX.Y.Z, <short sha>   (tag must match the VERSION file)
#   other branches   -> <branch slug>, <short sha>
# The build runs on the IN-CLUSTER BuildKit, not on a local Docker daemon: the runner is a Kubernetes
# executor with no /var/run/docker.sock, so `docker run --privileged tonistiigi/binfmt` and
# `--driver docker-container` could only ever fail with "Cannot connect to the Docker daemon" - this
# project's image has not been built since the runners moved into the clusters. `--driver remote` needs no
# daemon, and arm64 comes from the QEMU handler the builder's initContainer registers.
#
# No runner tag, so it builds on radut's builder (devops/argocd radut/platform/buildkit) rather than the
# nuc's: nothing pulls this image into the rpi cluster, and the nuc is the contended one.
.push_image:
  needs: ["test"]
  image: docker:27-cli
  stage: image
  variables:
    BUILDKIT_ADDR: tcp://buildkit.buildkit.svc.cluster.local:1234
  script:
    - export VERSION=$(tr -d '[:space:]' < VERSION)
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        if [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then
          echo "git tag $CI_COMMIT_TAG does not match VERSION file (v$VERSION)"; exit 1
        fi
        TAGS="-t ${IMAGE_REPO}:${CI_COMMIT_TAG}"
      elif [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        TAGS="-t ${IMAGE_REPO}:latest -t ${IMAGE_REPO}:v${VERSION}"
      else
        TAGS="-t ${IMAGE_REPO}:${CI_COMMIT_REF_SLUG}"
      fi
      export TAGS="${TAGS} -t ${IMAGE_REPO}:${CI_COMMIT_SHORT_SHA}"
    - echo "Pushing ${IMAGE_REPO} version ${VERSION} for ${BUILD_PLATFORMS} with ${TAGS}"
    - printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
    # One builder entry per job: the two push jobs run at once, and sharing one made uploads skip blobs
    # ("blob unknown to registry") elsewhere in the estate.
    - docker buildx create --name "ci-$CI_JOB_ID" --driver remote "$BUILDKIT_ADDR" --use
    # Prints the platforms the builder really offers. If arm64 is missing, its QEMU initContainer failed.
    - docker buildx inspect --bootstrap
    - docker buildx build
        --platform "${BUILD_PLATFORMS}"
        --provenance=false
        --build-arg VERSION="${VERSION}"
        --build-arg VCS_REF="${CI_COMMIT_SHA}"
        ${TAGS}
        --push .
    - docker buildx imagetools inspect "${IMAGE_REPO}:${CI_COMMIT_SHORT_SHA}"
  after_script:
    - docker buildx rm "ci-$CI_JOB_ID" || true

docker_io:
  extends: .push_image
  # Protected refs only - main and v* tags. The Docker Hub credentials are protected CI variables, so on
  # any other branch this job would run with an empty $REGISTRY_USER and die at `docker login` with "Must
  # provide --username with --password-stdin". gitlab_registry still runs everywhere: it authenticates with
  # the pipeline's own job token, so a feature branch keeps getting an image, just not a public one.
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  variables:
    REGISTRY_HOST: docker.io
    REGISTRY_USER: $DOCKERIO_USER
    REGISTRY_PASSWORD: $DOCKERIO_PASSWORD
    IMAGE_REPO: $DOCKERIO_USER/$CI_PROJECT_NAME

gitlab_registry:
  extends: .push_image
  variables:
    REGISTRY_HOST: $CI_REGISTRY
    REGISTRY_USER: $CI_REGISTRY_USER
    REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
    IMAGE_REPO: $CI_REGISTRY_IMAGE
